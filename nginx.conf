upstream sample_project_server {
  # fail_timeout=0 means we always retry an upstream even if it failed
  # to return a good HTTP response (in case the Unicorn master nukes a
  # single worker for timing out).
  server unix:/tmp/donationtracker.sock fail_timeout=0;
}

map $http_host $donate{
    'donate.bingothon.com' '1';
}

map $http_host $donations{
    'donations.bingothon.com' '1';
}

server {
    server_name donations.bingothon.com donate.bingothon.com;
    listen 80;
    listen 443;

    if ($scheme = http) {
       rewrite ^(.*) https://donations.bingothon.com/tracker/event/bingothonw24 redirect;
    } 
    if ($donate = 1){
       rewrite ^(.*) https://donations.bingothon.com/tracker/event/bingothonw24 redirect;
    }
    location ~ ^/$ {
        return 301 https://donations.bingothon.com/tracker/event/bingothonw24;
    } 

    client_max_body_size 1G;
    access_log /var/log/bingothon-donations-access.log;
    error_log /var/log/bingothon-donations-error.log;

    location /static/ {
        alias   /var/www/donations.bingothon.com/static/;
    }

    location /media/ {
        alias   /var/www/donations.bingothon.com/media/;
    }

    location /ws/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
        proxy_pass http://sample_project_server;
    }

    location / {

        # an HTTP header important enough to have its own Wikipedia entry:
        #   http://en.wikipedia.org/wiki/X-Forwarded-For
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;


        # enable this if and only if you use HTTPS, this helps Rack
        # set the proper protocol for doing redirects:
        proxy_set_header X-Forwarded-Proto https;

        # pass the Host: header from the client right along so redirects
        # can be set properly within the Rack application
        proxy_set_header Host $http_host;

        # we don't want nginx trying to do something clever with
        # redirects, we set the Host: header above already.
        proxy_redirect off;

        # set "proxy_buffering off" *only* for Rainbows! when doing
        # Comet/long-poll stuff.  It's also safe to set if you're
        # using only serving fast clients with Unicorn + nginx.
        # Otherwise you _want_ nginx to buffer responses to slow
        # clients, really.
        # proxy_buffering off;

        # Try to serve static files from nginx, no point in making an
        # *application* server like Unicorn/Rainbows! serve static files.
        if (!-f $request_filename) {
            proxy_pass http://sample_project_server;
            break;
        }
    }

    # Error pages
    error_page 500 502 503 504 /500.html;
    location = /500.html {
        root /home/ubuntu/static/;
    }



    ssl_certificate /etc/letsencrypt/live/discord.bingothon.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/discord.bingothon.com/privkey.pem; # managed by Certbot



}